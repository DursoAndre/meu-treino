<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ficha de Treino</title>
<meta name="theme-color" content="#14161A" />
<meta name="description" content="App pessoal de ficha de treino, agenda semanal e evolução de carga." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Treino" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  html, body { margin:0; padding:0; background:#14161A; }
  #root { min-height:100vh; }
  #boot-error { display:none; font-family:monospace; color:#FF5A36; background:#1D2024; border:1px solid #FF5A36; padding:16px; margin:16px; border-radius:6px; white-space:pre-wrap; font-size:13px; }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot-error"></div>
<script>
  function showBootError(msg) {
    var el = document.getElementById("boot-error");
    if (el) { el.style.display = "block"; el.textContent = "Erro ao carregar o app:\n\n" + msg + "\n\nTira um print desta mensagem e manda pro Claude."; }
  }
  window.addEventListener("error", function (e) { showBootError((e.error && e.error.stack) || e.message || String(e)); });
  window.addEventListener("unhandledrejection", function (e) { showBootError(String(e.reason && e.reason.stack || e.reason)); });
</script>
<script type="text/babel" data-presets="react" src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
